server.port=8080

# H2 in-memory database: data is reset on every restart
spring.datasource.url=jdbc:h2:mem:tasksdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Allowed origin for the React dev server (CORS is configured in CorsConfig)
app.cors.allowed-origins=http://localhost:5173

# Image uploads from the description editor (the service also enforces 2 MB)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
